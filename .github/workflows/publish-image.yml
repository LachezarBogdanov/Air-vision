
name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        run: docker build -t air-vision "./Air Vision/air-vision"

      - name: Tag Docker Image
        run: |
          docker tag air-vision ghcr.io/lachezarbogdanov/air-vision:${{ github.ref_name }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker tag air-vision ghcr.io/lachezarbogdanov/air-vision:latest
          fi

      - name: Push Docker Image
        run: |
          docker push ghcr.io/lachezarbogdanov/air-vision:${{ github.ref_name }}
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            docker push ghcr.io/lachezarbogdanov/air-vision:latest
          fi
