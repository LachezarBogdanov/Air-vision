
name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Image Tag
        run: echo "IMAGE_TAG=$(date '+%Y%m%d-%H%M%S-%3N')" >> $GITHUB_ENV

      - name: Build Docker Image
        run: docker build -t air-vision:latest "./Air Vision/air-vision"

      - name: Tag Docker Image
        run: docker tag air-vision:latest ghcr.io/lachezarbogdanov/air-vision:${{ env.IMAGE_TAG }}

      - name: Push Docker Image
        run: docker push ghcr.io/lachezarbogdanov/air-vision:${{ env.IMAGE_TAG }}
